name: near_run
description: "Offline-first running tracker with GPS route recording."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.1

  # Location + maps
  geolocator: ^11.0.0
  permission_handler: ^11.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  flutter_foreground_task: ^8.12.0
  wakelock_plus: ^1.2.8

  # Database + prefs
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # UI
  intl: ^0.19.0
  google_fonts: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
